services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - BACKEND_URL=http://localhost:8080
    
  backend:
    build: 
      context: ./backend/mycrm
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - app-network
    
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mycrm
      MYSQL_DATABASE: mycrm
      MYSQL_USER: root
      MYSQL_PASSWORD: mycrm
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - mysql-data:/var/lib/mysql

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data: